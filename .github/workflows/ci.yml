# PR と main への push のたびに、画面と API を自動で確かめる。
#  - frontend: lint（書き方 + 型チェック）・テスト（網羅率つき）・ビルド
#  - backend : テスト（Testcontainers が、使い捨ての PostgreSQL を Docker で起動する）
#  - e2e     : 本物の DB・API・画面を起動し、ブラウザ（Chromium）を自動で動かして、予約・変更・キャンセルを通しで確かめる
#  - check   : 上の 3 つがすべて成功したときだけ成功。GitHub のルールセットでは、この `check` を「必須のチェック」にする
# 公開リポジトリなので、権限は最小にし、Action はコミットの SHA で固定している（コメントの版と対応）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# このワークフローが使える権限を、リポジトリの読み取りだけにする（乗っ取られても書き換えられない）
permissions:
  contents: read

# 同じ PR で続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 後の手順に GitHub の認証情報を残さない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 部品を入れる（package-lock.json のとおりに）
        run: npm ci
      - name: lint（書き方チェック + 型チェック）
        run: npm run lint
      - name: テスト（網羅率も測る）
        run: npm run coverage
      - name: ビルド（型チェック + ビルド）
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      # Gradle の部品のキャッシュ。Gradle Wrapper の jar が公式のものかの確認も、これが行う
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # check = テスト（網羅率も測る）+ SpotBugs（静的解析）+ javac の警告（-Xlint:all -Werror）。DB のパスワードなどの秘密は使わない
      - name: 検査（テスト・SpotBugs・javac の警告）
        run: ./gradlew check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # E2E テスト用の PostgreSQL。使い捨てで、この実行が終われば消える
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: room_booking
          POSTGRES_PASSWORD: e2e-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U room_booking"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_USER: room_booking
      DB_PASSWORD: e2e-${{ github.run_id }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: 部品を入れる（package-lock.json のとおりに）
        run: npm ci
      - name: ブラウザ（Chromium）を入れる
        run: npx playwright install --with-deps chromium
      - name: E2E テスト（DB・API・画面は Playwright が起動する）
        run: npm run e2e
      # 失敗したときだけ、調べるための記録（画面の録画の代わりの trace）を残す
      - name: 失敗の記録を保存する
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # 3 つのジョブの結果をまとめる。どちらかが失敗・中止なら、ここも失敗する
  check:
    needs: [frontend, backend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 結果を確かめる
        run: |
          echo "frontend: ${{ needs.frontend.result }} / backend: ${{ needs.backend.result }} / e2e: ${{ needs.e2e.result }}"
          [ "${{ needs.frontend.result }}" = "success" ] && [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ]
