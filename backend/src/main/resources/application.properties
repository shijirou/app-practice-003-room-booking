spring.application.name=room-booking
server.port=8080
# ログインが無いので、自分のパソコンの中からだけつなげる（同じネットワークの別のパソコンからは見えない）
server.address=127.0.0.1
# エラーの内部の詳細（スタックトレース・例外のメッセージ）を、画面や API の返事に出さない
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# DB の接続情報は、リポジトリ直下の .env（GitHub には載せない）か、環境変数から読む。
# backend/ から起動しても、リポジトリ直下から起動しても、同じ .env が見つかるようにしている。
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:room_booking}
spring.datasource.username=${DB_USER:room_booking}
# パスワードには初期値を置かない。.env も環境変数も無いときは、起動時に「DB_PASSWORD が無い」と分かるエラーで止まる
spring.datasource.password=${DB_PASSWORD}

# 表は Flyway（src/main/resources/db/migration）で作る。JPA は表の形を確かめるだけ
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
