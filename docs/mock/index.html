<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会議室予約（画面モック）</title>
<style>
  :root { --bg:#dce0e5; --text:#1b1f24; --sub:#5f6975; --card:#fff; --blue:#0b5cad; --other:#c9ced6; --red:#b3261e; --line:#c4cad2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Yu Gothic UI","Meiryo",sans-serif; font-size:15px; }
  .wrap { max-width:1200px; margin:0 auto; padding:16px; }
  .note { background:#fff8d6; border:1px solid #e0c64a; padding:6px 10px; border-radius:6px; font-size:13px; margin-bottom:12px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:16px; margin:0 0 10px; }
  .card { background:var(--card); border-radius:8px; padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  select, input[type=text], input[type=date] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.danger:hover { color:var(--red); border-color:var(--red); }
  .datebar { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .datebar .label { font-weight:bold; min-width:130px; text-align:center; }
  .gridwrap { overflow-x:auto; }
  table { border-collapse:collapse; table-layout:fixed; width:100%; min-width:900px; }
  th, td { border:1px solid var(--line); height:38px; padding:0; text-align:center; font-size:12px; }
  th.room { width:150px; white-space:nowrap; text-align:left; padding:0 8px; background:#f3f5f7; font-size:13px; }
  th.hour { background:#f3f5f7; color:var(--sub); font-weight:normal; }
  td.free { background:#fff; cursor:pointer; }
  td.free:hover { background:#e3eefb; }
  td.past { background:#eef0f3; cursor:not-allowed; }
  td.busy { background:var(--other); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 4px; }
  td.mine { background:var(--blue); color:#fff; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 4px; }
  .legend { font-size:12px; color:var(--sub); margin-top:8px; }
  .legend span { display:inline-block; width:12px; height:12px; vertical-align:middle; border:1px solid var(--line); margin:0 4px 0 12px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .row { display:grid; grid-template-columns:70px 1fr; gap:8px; align-items:center; margin-bottom:10px; }
  .row select, .row input { width:100%; max-width:260px; }
  .err { color:var(--red); min-height:1.4em; margin-bottom:6px; font-size:14px; }
  .ok { color:#1a7f37; min-height:1.4em; font-size:14px; }
  .item { border-bottom:1px solid #e6e9ed; padding:8px 0; display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .item:last-child { border-bottom:none; }
  .item .sub { color:var(--sub); font-size:13px; }
  .item .btns { display:flex; gap:16px; flex-shrink:0; }
  .empty { color:var(--sub); padding:6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="note">画面の見た目と操作を確認するためのモックです（DB・API なし。予約の重複・時間の検証は画面の中だけで動きます。リロードすると元に戻ります）。社員・会議室はすべて架空です。</div>
  <header>
    <h1>会議室予約</h1>
    <label>操作する社員 <select id="who"></select></label>
  </header>

  <section class="card">
    <div class="datebar">
      <button id="prev">◀ 前の日</button>
      <span class="label" id="dateLabel"></span>
      <button id="today">今日</button>
      <button id="next">次の日 ▶</button>
      <input type="date" id="datePick" aria-label="日付を選ぶ">
    </div>
    <div class="gridwrap"><table id="grid"></table></div>
    <div class="legend">
      <span style="background:#fff"></span>空き（押すと予約フォームに入ります）
      <span style="background:var(--other)"></span>ほかの人の予約
      <span style="background:var(--blue)"></span>自分の予約
      <span style="background:#eef0f3"></span>過去
    </div>
  </section>

  <div class="cols">
    <section class="card">
      <h2 id="formTitle">予約する</h2>
      <div class="err" id="err" role="alert"></div>
      <div class="row"><label for="room">会議室</label><select id="room"></select></div>
      <div class="row"><label for="date">日付</label><input type="date" id="date"></div>
      <div class="row"><label for="start">開始</label><select id="start"></select></div>
      <div class="row"><label for="end">終了</label><select id="end"></select></div>
      <div class="row"><label for="purpose">用件</label><input type="text" id="purpose" maxlength="50" placeholder="任意（50 文字まで）"></div>
      <button class="primary" id="submit">予約する</button>
      <button id="cancelEdit" style="display:none">やめる</button>
      <div class="ok" id="ok" role="status"></div>
    </section>
    <section class="card">
      <h2>自分の予約</h2>
      <div id="mine"></div>
    </section>
  </div>
</div>

<script>
const OPEN = 8*60, CLOSE = 20*60, STEP = 30;
const employees = [{id:1,name:"田中架空"},{id:2,name:"佐藤架空"},{id:3,name:"鈴木架空"},{id:4,name:"高橋架空"},{id:5,name:"伊藤架空"},{id:6,name:"渡辺架空"}];
const rooms = [{id:1,name:"会議室A",cap:4},{id:2,name:"会議室B",cap:6},{id:3,name:"会議室C",cap:10},{id:4,name:"商談ブース",cap:2}];
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = m => `${Math.floor(m/60)}:${pad(m%60)}`;
const youbi = s => "日月火水木金土"[new Date(s+"T00:00:00").getDay()];
const nowMin = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const today = ymd(new Date());
const addDays = (s,n) => { const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };

let nextId = 100;
let reservations = [
  {id:1,roomId:1,empId:2,date:today,start:9*60,end:10*60+30,purpose:"営業定例"},
  {id:2,roomId:2,empId:1,date:today,start:13*60,end:14*60,purpose:"架空商事 オンライン商談"},
  {id:3,roomId:3,empId:4,date:today,start:15*60,end:17*60,purpose:"企画会議"},
  {id:4,roomId:4,empId:1,date:addDays(today,2),start:10*60,end:11*60,purpose:"オンライン商談"},
  {id:5,roomId:1,empId:3,date:addDays(today,1),start:14*60,end:15*60,purpose:"面談"},
];
let who = 1, viewDate = today, editingId = null;
const $ = id => document.getElementById(id);
const empName = id => employees.find(e=>e.id===id).name;
const roomName = id => rooms.find(r=>r.id===id).name;

function slotOpts(sel, from, to, selected) {
  sel.innerHTML = "";
  for (let m=from; m<=to; m+=STEP) { const o=document.createElement("option"); o.value=m; o.textContent=hm(m); if (m===selected) o.selected=true; sel.appendChild(o); }
}
function fillEnd(preferred) {
  const s = Number($("start").value);
  const want = preferred ?? Math.min(s+60, CLOSE);
  slotOpts($("end"), s+STEP, CLOSE, want);
}
function setForm(roomId, date, start, end, purpose) {
  $("room").value = roomId; $("date").value = date;
  $("start").value = start; fillEnd(end); $("purpose").value = purpose || "";
}
function isPast(date, startMin) { return date < today || (date === today && startMin < nowMin()); }

function renderGrid() {
  $("dateLabel").textContent = `${viewDate}(${youbi(viewDate)})`;
  $("datePick").value = viewDate;
  let h = `<tr><th class="room">会議室</th>`;
  for (let m=OPEN; m<CLOSE; m+=60) h += `<th class="hour" colspan="2">${hm(m)}</th>`;
  h += "</tr>";
  for (const r of rooms) {
    h += `<tr><th class="room">${r.name}（${r.cap}名）</th>`;
    const day = reservations.filter(x=>x.roomId===r.id && x.date===viewDate);
    for (let m=OPEN; m<CLOSE; ) {
      const rv = day.find(x=>x.start===m);
      if (rv) {
        const span=(rv.end-rv.start)/STEP, mine=rv.empId===who;
        h += `<td class="${mine?"mine":"busy"}" colspan="${span}" title="${hm(rv.start)}〜${hm(rv.end)} ${esc(rv.purpose||"（用件なし）")}（${empName(rv.empId)}）">${esc(rv.purpose||"（用件なし）")}（${empName(rv.empId).replace("架空","")}）</td>`;
        m = rv.end;
      } else if (day.some(x=>x.start<m && x.end>m)) { m += STEP; }
      else {
        const past = isPast(viewDate, m);
        h += `<td class="${past?"past":"free"}" data-room="${r.id}" data-m="${m}"></td>`;
        m += STEP;
      }
    }
    h += "</tr>";
  }
  $("grid").innerHTML = h;
}

function renderMine() {
  const list = reservations.filter(x=>x.empId===who && !isPast(x.date, x.end-1))
    .sort((a,b)=> a.date===b.date ? a.start-b.start : a.date.localeCompare(b.date));
  $("mine").innerHTML = list.length ? list.map(x=>`
    <div class="item"><div><div>${x.date.slice(5).replace("-","/")}(${youbi(x.date)}) ${hm(x.start)}〜${hm(x.end)} ${roomName(x.roomId)}</div>
    <div class="sub">${esc(x.purpose||"（用件なし）")}</div></div>
    <div class="btns"><button data-edit="${x.id}">変更</button><button class="danger" data-del="${x.id}">キャンセル</button></div></div>`).join("")
    : `<div class="empty">予約はまだありません</div>`;
}
function renderAll() { renderGrid(); renderMine(); }

function validate() {
  const roomId=Number($("room").value), date=$("date").value, s=Number($("start").value), e=Number($("end").value);
  if (!date) return "日付を選んでください";
  if (!(e > s)) return "終了は開始より後にしてください";
  if (s < OPEN || e > CLOSE) return "予約できるのは 8:00〜20:00 の間です";
  if (isPast(date, s)) return "過去の日時は予約できません";
  const clash = reservations.some(x=>x.id!==editingId && x.roomId===roomId && x.date===date && x.start<e && x.end>s);
  if (clash) return "その時間はすでに予約があります";
  return null;
}
function resetForm() {
  editingId = null;
  $("formTitle").textContent="予約する"; $("submit").textContent="予約する"; $("cancelEdit").style.display="none";
  setForm(rooms[0].id, viewDate, OPEN+60, null, "");
}

$("submit").onclick = () => {
  $("ok").textContent = "";
  const msg = validate(); $("err").textContent = msg || "";
  if (msg) return;
  const v = { roomId:Number($("room").value), date:$("date").value, start:Number($("start").value), end:Number($("end").value), purpose:$("purpose").value.trim() };
  if (editingId) { Object.assign(reservations.find(x=>x.id===editingId), v); $("ok").textContent = "予約を変更しました"; }
  else { reservations.push({id:nextId++, empId:who, ...v}); $("ok").textContent = "予約しました"; }
  viewDate = v.date; resetForm(); renderAll();
};
$("cancelEdit").onclick = () => { $("err").textContent=""; resetForm(); };
$("grid").onclick = e => {
  const td = e.target.closest("td.free"); if (!td) return;
  editingId = null; $("formTitle").textContent="予約する"; $("submit").textContent="予約する"; $("cancelEdit").style.display="none";
  $("err").textContent=""; $("ok").textContent="";
  const m = Number(td.dataset.m);
  setForm(Number(td.dataset.room), viewDate, m, Math.min(m+60, CLOSE), "");
};
$("mine").onclick = e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) {
    const x = reservations.find(r=>r.id===Number(ed)); editingId = x.id;
    $("formTitle").textContent="予約を変更する"; $("submit").textContent="変更を保存"; $("cancelEdit").style.display="";
    $("err").textContent=""; $("ok").textContent="";
    setForm(x.roomId, x.date, x.start, x.end, x.purpose);
    window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
  }
  if (del && confirm("この予約をキャンセルしますか？")) {
    reservations = reservations.filter(r=>r.id!==Number(del));
    if (editingId===Number(del)) resetForm();
    $("ok").textContent = "予約をキャンセルしました"; renderAll();
  }
};
$("who").onchange = () => { who = Number($("who").value); resetForm(); $("err").textContent=""; $("ok").textContent=""; renderAll(); };
$("start").onchange = () => fillEnd(null);
const go = d => { viewDate = d; renderGrid(); };
$("prev").onclick = () => go(addDays(viewDate,-1));
$("next").onclick = () => go(addDays(viewDate,1));
$("today").onclick = () => go(today);
$("datePick").onchange = () => { if ($("datePick").value) go($("datePick").value); };

// 初期表示
$("who").innerHTML = employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join("");
$("room").innerHTML = rooms.map(r=>`<option value="${r.id}">${r.name}（${r.cap}名）</option>`).join("");
slotOpts($("start"), OPEN, CLOSE-STEP, OPEN+60);
resetForm(); renderAll();
</script>
</body>
</html>
