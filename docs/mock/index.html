<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会議室予約（画面モック）</title>
<style>
  :root { --bg:#eef1f5; --text:#1b1f24; --sub:#5f6975; --card:#fff; --blue:#0b5cad; --other:#cfd6e4; --red:#b3261e; --line:#c4cad2; --soft:#e6e9ee; --hatch:repeating-linear-gradient(45deg,#f1f3f6,#f1f3f6 4px,#e2e6eb 4px,#e2e6eb 5px); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Yu Gothic UI","Meiryo",sans-serif; font-size:15px; }
  .wrap { max-width:1280px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .card { background:var(--card); border-radius:8px; padding:14px; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  select, input[type=text], input[type=date] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button:hover { background:#f3f5f7; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.primary:hover { background:#094b8f; }
  button.danger { color:var(--red); border-color:#e3b5b1; }
  button.danger:hover { background:#fdecea; border-color:var(--red); }
  .datebar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .datebar .label { font-weight:bold; font-size:18px; margin:0 4px 0 8px; }
  .clock { background:#eef3fa; color:var(--blue); border-radius:999px; padding:3px 12px; font-size:14px; font-weight:bold; }
  .datebar .spacer { flex:1; }
  .gridwrap { overflow-x:auto; position:relative; }
  table { border-collapse:collapse; table-layout:fixed; width:100%; min-width:960px; user-select:none; }
  th, td { border:1px solid var(--soft); height:44px; padding:0; text-align:center; font-size:13px; }
  th.room { width:150px; white-space:nowrap; text-align:left; padding:0 10px; background:#f3f5f7; border-color:var(--line); }
  th.hour { background:#f3f5f7; color:var(--sub); font-weight:normal; padding:0 6px; border-color:var(--line); }
  th.hour div { display:flex; justify-content:space-between; }
  td.hr { border-left-color:#d6dbe2; }
  td.free { background:#fff; cursor:pointer; }
  tr.alt td.free:not(:hover):not(.sel) { background:#f9fafb; }   /* 1 行おきに薄いグレー（右端まで目で追いやすく） */
  td.free:hover::after { content:"＋"; color:var(--blue); font-weight:bold; }
  td.free:hover { background:#e3eefb; }
  td.sel, td.sel:hover { background:#b9d5f5; }
  td.past { background:var(--hatch); cursor:not-allowed; }
  td.draft { background:#dbe9fb; border:2px dashed var(--blue); color:var(--blue); font-weight:bold; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 6px; }
  td.busy, td.mine { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 6px; border-color:#fff; cursor:pointer; }
  td.busy { background:var(--other); color:#2b3342; }
  td.busy:hover { background:#bcc6da; }
  td.mine { background:var(--blue); color:#fff; font-weight:bold; }
  td.mine:hover { background:#094b8f; }
  td.flash { animation:flash 1.4s ease-out 1; }
  @keyframes flash { 0%,40% { box-shadow:inset 0 0 0 3px #ffd54a, 0 0 12px 2px #ffd54a; } 100% { box-shadow:none; } }
  #nowline { position:absolute; width:2px; background:var(--red); pointer-events:none; display:none; }
  #nowline::before { content:""; position:absolute; top:-4px; left:-4px; width:10px; height:10px; border-radius:50%; background:var(--red); }
  .infobar { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .infobar .hint { margin:0; flex:1; min-width:320px; }
  .legend { font-size:13px; color:var(--sub); white-space:nowrap; }
  .legend span { display:inline-block; width:14px; height:14px; vertical-align:middle; border:1px solid var(--line); border-radius:3px; margin:0 5px 0 16px; }
  .legend span:first-child { margin-left:0; }
  .hint { font-size:13px; color:var(--sub); margin:0 0 8px; }
  header.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  header.top h1 { margin:0; }
  .loginbar { display:flex; align-items:center; gap:8px; color:var(--sub); font-size:14px; }
  .cols { margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .list { max-height:340px; overflow-y:auto; padding-right:2px; }
  .rcard { display:flex; align-items:center; gap:10px; min-height:30px; border:1px solid var(--line); border-left:5px solid var(--other); border-radius:6px; padding:3px 10px; margin-bottom:5px; background:#fff; font-size:13px; transition:box-shadow .12s, background .12s; }
  .rcard:last-child { margin-bottom:0; }
  .rcard.mine { border-left-color:var(--blue); background:#f2f7fd; }
  .rcard:hover { box-shadow:0 2px 8px rgba(0,0,0,.18); background:#fffbe8; }
  .rcard.jump { cursor:pointer; }
  .rcard.done { opacity:.55; }
  .rcard .rtime { font-weight:bold; white-space:nowrap; }
  .rcard .rsub { flex:1; min-width:0; color:var(--sub); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .rcard .btns { display:flex; gap:6px; }
  .rcard .btns button { padding:1px 8px; font-size:12px; }
  .vline { position:absolute; top:0; pointer-events:none; z-index:1; }
  .vline.h { width:2px; background:rgba(45,55,72,.11); margin-left:-1px; }
  .vline.m { width:1px; background:rgba(45,55,72,.05); }
  .tag { display:inline-block; margin-left:8px; padding:0 8px; border-radius:999px; background:var(--blue); color:#fff; font-size:11px; font-weight:normal; vertical-align:1px; }
  td.hl { outline:4px solid #ffb300; outline-offset:-4px; position:relative; z-index:2; }
  .clock.away { background:#fff1cc; color:#7a4b00; }
  .empty { color:var(--sub); padding:6px 0; }
  .err { color:var(--red); background:#fdecea; border-radius:6px; padding:6px 10px; margin-bottom:10px; font-size:14px; }
  .err:empty { display:none; }
  #pop { display:none; position:absolute; z-index:20; width:330px; background:#fff; border-radius:10px; padding:14px; box-shadow:0 8px 28px rgba(0,0,0,.25); border:1px solid var(--line); }
  .pop-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .pop-head .x { border:none; background:none; font-size:20px; line-height:1; padding:0 4px; color:var(--sub); }
  .prow { display:grid; grid-template-columns:56px 1fr; gap:8px; align-items:center; margin-bottom:10px; }
  .prow select, .prow input[type=text], .prow input[type=date] { width:100%; }
  .times { display:flex; gap:6px; align-items:center; }
  .times select { flex:1; }
  .pbtns { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
  .detail { margin:0 0 12px; line-height:1.7; }
  .detail .big { font-size:16px; font-weight:bold; }
  .note { color:var(--sub); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#1f2933; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; }
  #toast.show { opacity:1; }
  footer { margin-top:14px; font-size:12px; color:var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>会議室予約</h1><label class="loginbar">ログイン中（仮）<select id="who"></select></label></header>

  <section class="card">
    <div class="datebar">
      <button id="prev" aria-label="前の日">◀</button>
      <button id="today">今日</button>
      <button id="next" aria-label="次の日">▶</button>
      <span class="label" id="dateLabel"></span>
      <span class="clock" id="clock"></span>
      <span class="spacer"></span>
      <input type="date" id="datePick" aria-label="日付を選ぶ">
    </div>
    <div class="infobar">
      <p class="hint" id="hint"></p>
      <div class="legend">
        <span style="background:#fff"></span>空き
        <span style="background:var(--other)"></span>ほかの人の予約
        <span style="background:var(--blue);border-color:var(--blue)"></span>自分の予約
        <span style="background:var(--hatch)"></span>過去（予約できません）
      </div>
    </div>
    <div class="gridwrap"><table id="grid"></table><div id="vlines"></div><div id="nowline"></div></div>
  </section>

  <div class="cols">
    <section class="card">
      <h2 id="mineTitle">自分の予約（今後）</h2>
      <div id="mine" class="list"></div>
    </section>
    <section class="card">
      <h2 id="dayTitle">選んだ日の予約</h2>
      <div id="day" class="list"></div>
    </section>
  </div>

  <footer>画面の見た目と操作を確認するためのモックです（DB・API なし。重複や時間の検証は画面の中だけで動き、再読み込みで元に戻ります）。社員・会議室はすべて架空です。</footer>
</div>

<div id="pop" role="dialog" aria-label="予約"></div>
<div id="toast" role="status"></div>

<script>
const OPEN = 8*60, CLOSE = 20*60, UNIT = 30;   // 要件定義書: 8:00〜20:00、30 分刻み
const employees = [{id:1,name:"田中架空"},{id:2,name:"佐藤架空"},{id:3,name:"鈴木架空"},{id:4,name:"高橋架空"},{id:5,name:"伊藤架空"},{id:6,name:"渡辺架空"}];
const rooms = [{id:1,name:"会議室A",cap:4},{id:2,name:"会議室B",cap:6},{id:3,name:"会議室C",cap:10},{id:4,name:"商談ブース",cap:2}];
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = m => `${Math.floor(m/60)}:${pad(m%60)}`;
const youbi = s => "日月火水木金土"[new Date(s+"T00:00:00").getDay()];
const nowMin = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const today = ymd(new Date());
const addDays = (s,n) => { const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const longDate = s => { const [y,m,d]=s.split("-").map(Number); return `${y}年${m}月${d}日（${youbi(s)}）`; };
const shortDate = s => `${Number(s.slice(5,7))}/${Number(s.slice(8))}(${youbi(s)})`;
// 予約を始められる最も早い時刻（今日は、今の時刻を 30 分単位で切り上げ）
const minStart = date => date < today ? Infinity : date === today ? Math.ceil(nowMin()/UNIT)*UNIT : 0;
const finished = x => x.date < today || (x.date === today && x.end <= nowMin());
const started = x => x.date < today || (x.date === today && x.start <= nowMin());

let nextId = 100;
let reservations = [
  {id:1,roomId:1,empId:2,date:today,start:9*60,end:10*60+30,purpose:"営業定例"},
  {id:2,roomId:2,empId:1,date:today,start:13*60,end:14*60,purpose:"架空商事 オンライン商談"},
  {id:3,roomId:3,empId:4,date:today,start:15*60,end:17*60,purpose:"企画会議"},
  {id:4,roomId:4,empId:1,date:addDays(today,2),start:10*60,end:11*60,purpose:"オンライン商談"},
  {id:5,roomId:1,empId:3,date:addDays(today,1),start:14*60,end:15*60,purpose:"面談"},
  {id:6,roomId:2,empId:5,date:addDays(today,1),start:10*60,end:12*60,purpose:"採用面接"},
  {id:7,roomId:4,empId:6,date:addDays(today,1),start:9*60+30,end:10*60,purpose:"電話会議"},
  // 例題（日付・会議室・社員をばらけさせている）
  {id:8,roomId:4,empId:3,date:today,start:11*60,end:12*60,purpose:"来客対応"},
  {id:9,roomId:1,empId:1,date:today,start:14*60,end:15*60,purpose:"週次ミーティング"},
  {id:10,roomId:2,empId:6,date:today,start:16*60,end:17*60+30,purpose:"新人研修"},
  {id:11,roomId:3,empId:2,date:today,start:10*60,end:11*60,purpose:"資料レビュー"},
  {id:12,roomId:1,empId:5,date:today,start:17*60,end:18*60,purpose:"1on1"},
  {id:13,roomId:1,empId:1,date:addDays(today,1),start:9*60,end:10*60,purpose:"朝会"},
  {id:14,roomId:3,empId:4,date:addDays(today,1),start:13*60,end:15*60,purpose:"予算会議"},
  {id:15,roomId:4,empId:2,date:addDays(today,1),start:15*60,end:16*60,purpose:"オンライン商談"},
  {id:16,roomId:2,empId:3,date:addDays(today,1),start:14*60,end:15*60+30,purpose:"勉強会"},
  {id:17,roomId:3,empId:6,date:addDays(today,1),start:10*60+30,end:11*60+30,purpose:"面接"},
  {id:18,roomId:1,empId:5,date:addDays(today,2),start:10*60,end:12*60,purpose:"企画会議"},
  {id:19,roomId:2,empId:1,date:addDays(today,2),start:13*60,end:14*60,purpose:"架空商事 打ち合わせ"},
  {id:20,roomId:3,empId:3,date:addDays(today,2),start:9*60,end:10*60,purpose:"朝会"},
  {id:21,roomId:4,empId:4,date:addDays(today,2),start:14*60,end:15*60,purpose:"電話会議"},
  {id:22,roomId:1,empId:2,date:addDays(today,2),start:15*60,end:16*60,purpose:"面談"},
  {id:23,roomId:2,empId:1,date:addDays(today,3),start:10*60,end:11*60,purpose:"営業定例"},
  {id:24,roomId:3,empId:6,date:addDays(today,3),start:13*60,end:15*60,purpose:"研修"},
  {id:25,roomId:1,empId:3,date:addDays(today,3),start:11*60,end:12*60,purpose:"面談"},
  {id:26,roomId:4,empId:1,date:addDays(today,5),start:16*60,end:17*60,purpose:"オンライン商談"},
  {id:27,roomId:2,empId:2,date:addDays(today,5),start:9*60,end:10*60,purpose:"定例"},
];
let who = 1, viewDate = today, sel = null, drag = null, pop = {mode:null,id:null};
const $ = id => document.getElementById(id);
const empName = id => employees.find(e=>e.id===id).name;
const roomName = id => rooms.find(r=>r.id===id).name;
const find = id => reservations.find(r=>r.id===id);
const overlaps = (room,date,lo,hi,exceptId) => reservations.some(x=>x.id!==exceptId && x.roomId===room && x.date===date && x.start<hi && x.end>lo);
// その開始時刻から、最大 1 時間（次の予約・閉館まで）
const maxEnd = (room,date,start) => Math.min(CLOSE, start+60, ...reservations.filter(x=>x.roomId===room && x.date===date && x.start>=start).map(x=>x.start));

function toast(msg) { const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"), 2500); }

/* ---------- 表（30 分単位） ---------- */
function renderGrid() {
  $("dateLabel").textContent = longDate(viewDate);
  $("datePick").value = viewDate;
  const ms = minStart(viewDate), n = nowMin();
  $("hint").textContent = `空いている枠を押すと予約できます（ドラッグで長い時間をまとめて選べます）。予約できる時間は ${hm(OPEN)}〜${hm(CLOSE)}、時刻は 30 分刻みです。`
    + (viewDate===today ? (ms>=CLOSE ? " 本日の受付は終了しました。" : ` 今日は ${hm(ms)} 以降から予約できます。`) : "");
  let h = `<tr><th class="room">会議室</th>`;
  for (let m=OPEN; m<CLOSE; m+=60) h += `<th class="hour" colspan="${60/UNIT}"><div><span>${hm(m)}</span>${m+60===CLOSE?`<span>${hm(CLOSE)}</span>`:""}</div></th>`;
  h += "</tr>";
  const hiddenId = pop.mode==="edit" ? pop.id : null;
  for (const r of rooms) {
    h += `<tr class="${rooms.indexOf(r)%2===1?"alt":""}"><th class="room">${r.name}（${r.cap}名）</th>`;
    const day = reservations.filter(x=>x.roomId===r.id && x.date===viewDate && x.id!==hiddenId);
    if (sel && sel.draft && sel.roomId===r.id && sel.date===viewDate && sel.end>sel.start) day.push({draft:true, start:sel.start, end:sel.end});
    for (let m=OPEN; m<CLOSE; ) {
      const rv = day.find(x=>x.start===m);
      if (rv) {
        const span=(rv.end-rv.start)/UNIT;
        if (rv.draft) h += `<td class="draft" colspan="${span}">${hm(rv.start)}〜${hm(rv.end)} 予約中…</td>`;
        else {
          const mine=rv.empId===who, label=`${esc(rv.purpose||"（用件なし）")}（${empName(rv.empId).replace("架空","")}）`;
          h += `<td class="${mine?"mine":"busy"}" data-id="${rv.id}" colspan="${span}" title="${hm(rv.start)}〜${hm(rv.end)} ${esc(rv.purpose||"（用件なし）")}（${empName(rv.empId)}）">${label}</td>`;
        }
        m = rv.end; continue;
      }
      if (day.some(x=>x.start<m && x.end>m)) { m += UNIT; continue; }
      const len = UNIT;
      const past = m+len <= ms;
      h += `<td class="${past?"past":"free"}${m%60===0?" hr":""}" colspan="${len/UNIT}" data-room="${r.id}" data-m="${m}" data-len="${len}"${past?' title="過去の時間は予約できません"':""}></td>`;
      m += len;
    }
    h += "</tr>";
  }
  $("grid").innerHTML = h;
  paintSel(); placeNow(); tickClock();
}
function paintSel() {
  document.querySelectorAll("td.sel").forEach(td=>td.classList.remove("sel"));
  if (!sel || sel.draft) return;
  document.querySelectorAll(`td.free[data-room="${sel.roomId}"]`).forEach(td => {
    const m=Number(td.dataset.m), e=m+Number(td.dataset.len);
    if (m<sel.end && e>sel.start) td.classList.add("sel");
  });
}
function drawVLines() {   // 時刻の縦線（1 時間ごとは太く、30 分ごとは細く）。奥の会議室まで見失わないように
  const t=$("grid"), rw=t.querySelector("th.room").offsetWidth, w=t.offsetWidth-rw;
  let h = "";
  for (let m=OPEN+UNIT; m<CLOSE; m+=UNIT) {
    const x = rw + (m-OPEN)/(CLOSE-OPEN)*w;
    h += `<div class="vline ${m%60===0?"h":"m"}" style="left:${x}px;top:${t.offsetTop}px;height:${t.offsetHeight}px"></div>`;
  }
  $("vlines").innerHTML = h;
}
function placeNow() {
  drawVLines();
  const line=$("nowline"), n=nowMin();
  if (viewDate!==today || n<OPEN || n>=CLOSE) { line.style.display="none"; return; }
  const t=$("grid"), rw=t.querySelector("th.room").offsetWidth;
  line.style.display="block";
  line.style.left = (rw + (n-OPEN)/(CLOSE-OPEN)*(t.offsetWidth-rw)) + "px";
  line.style.top = t.offsetTop+"px"; line.style.height = t.offsetHeight+"px";
}
function flash(id) { const c=document.querySelector(`td[data-id="${id}"]`); if (c) { c.classList.add("flash"); c.scrollIntoView({block:"nearest",inline:"nearest"}); } }
function tickClock() {   // 今日以外の日を見ているときは、今日の日付も出す
  const away = viewDate !== today, c = $("clock");
  c.textContent = away ? `今日 ${shortDate(today)}　現在 ${hm(nowMin())}` : `現在 ${hm(nowMin())}`;
  c.classList.toggle("away", away);
}
function hl(id) {   // カードに重ねたとき、表の予約枠を強調する
  document.querySelectorAll("td.hl").forEach(t=>t.classList.remove("hl"));
  if (id) { const t=document.querySelector(`td[data-id="${id}"]`); if (t) t.classList.add("hl"); }
}

/* ---------- 下の欄（自分の予約・みんなの予約） ---------- */
function renderMine() {   // 自分の今後の予約（カードを押すと、その日にジャンプ）
  const list = reservations.filter(x=>x.empId===who && !finished(x))
    .sort((a,b)=> a.date===b.date ? a.start-b.start : a.date.localeCompare(b.date));
  $("mineTitle").textContent = `自分（${empName(who)}）の予約（今後）`;   // 誤ログインに気づけるよう名前を出す
  $("mine").innerHTML = list.length ? list.map(x=>`
    <div class="rcard mine jump${x.date===viewDate?" here":""}" data-id="${x.id}" title="押すと ${shortDate(x.date)} にジャンプします">
      <div class="rtime">${shortDate(x.date)} ${hm(x.start)}〜${hm(x.end)}</div>
      <div class="rsub">${roomName(x.roomId)} ／ ${esc(x.purpose||"（用件なし）")}</div>
      ${started(x) ? `<span class="rsub" style="flex:none">進行中</span>`
        : `<div class="btns"><button data-edit="${x.id}">変更</button><button class="danger" data-del="${x.id}">キャンセル</button></div>`}</div>`).join("")
    : `<div class="empty">予約はまだありません。<br>上の表の空き枠を押して予約できます。</div>`;
}
function renderDay() {   // 選んだ日の、みんなの予約（自分の予約も含む）
  $("dayTitle").textContent = `${shortDate(viewDate)} の予約（みんな）`;
  const list = reservations.filter(x=>x.date===viewDate).sort((a,b)=>a.start-b.start||a.roomId-b.roomId);
  $("day").innerHTML = list.length ? list.map(x=>`
    <div class="rcard ${x.empId===who?"mine":"other"}${finished(x)?" done":""}" data-id="${x.id}">
      <div class="rtime">${hm(x.start)}〜${hm(x.end)}</div>
      <div class="rsub">${roomName(x.roomId)} ／ ${esc(x.purpose||"（用件なし）")}（${empName(x.empId)}）</div>
      ${x.empId===who?`<span class="tag" style="margin:0">自分</span>`:""}</div>`).join("")
    : `<div class="empty">この日の予約はまだありません</div>`;
}
function renderAll() { renderGrid(); renderMine(); renderDay(); }

/* ---------- ポップアップ ---------- */
function slotOpts(el, from, to, selected) {
  el.innerHTML = "";
  for (let m=from; m<=to; m+=UNIT) { const o=document.createElement("option"); o.value=m; o.textContent=hm(m); if (m===selected) o.selected=true; el.appendChild(o); }
}
function fillEnd(preferred) {
  const s = Number($("p_start").value);
  const want = preferred && preferred > s ? preferred : Math.min(s+60, CLOSE);
  slotOpts($("p_end"), s+UNIT, CLOSE, want);
}
function placePop(rect) {
  const p=$("pop"); p.style.display="block";
  const w=330, h=p.offsetHeight;
  const left = Math.min(Math.max(rect.left, 8), window.innerWidth-w-8);
  let top = rect.bottom + 8;
  if (top + h > window.innerHeight) top = rect.top - h - 8 >= 0 ? rect.top - h - 8 : Math.max(8, window.innerHeight - h - 8);
  p.style.left = (left + window.scrollX) + "px"; p.style.top = (top + window.scrollY) + "px";
}
function closePop() {
  if (!pop.mode && !sel) return;
  $("pop").style.display="none"; pop={mode:null,id:null}; sel=null; renderGrid();
}
function syncDraft() {   // 選んだ内容を、表にすぐ仮表示する
  const date=$("p_date").value;
  sel = {roomId:Number($("p_room").value), date, start:Number($("p_start").value), end:Number($("p_end").value), draft:true};
  if (date && date!==viewDate) viewDate = date;
  renderAll();
}

function openPop(o, rect) {
  pop = {mode:o.mode, id:o.id ?? null};
  const p=$("pop");
  if (o.mode==="view") {
    const mine = o.empId===who;
    p.innerHTML = `
      <div class="pop-head"><strong>予約の内容</strong><button class="x" id="p_close" aria-label="閉じる">×</button></div>
      <p class="detail"><span class="big">${hm(o.start)}〜${hm(o.end)}</span><br>${roomName(o.roomId)} ／ ${longDate(o.date)}<br>用件：${esc(o.purpose||"（用件なし）")}<br>予約した人：${empName(o.empId)}</p>
      ${!mine ? `<div class="note">他の人の予約は変更できません。</div>`
        : started(o) ? `<div class="note">始まった予約は変更・キャンセルできません。</div>`
        : `<div class="pbtns"><button class="danger" id="p_del">キャンセルする</button><button class="primary" id="p_edit">変更する</button></div>`}`;
    placePop(rect);
    $("p_close").onclick = closePop;
    if ($("p_edit")) { $("p_edit").onclick = () => openPop({...o, mode:"edit"}, rect); $("p_del").onclick = () => removeRes(o.id); }
    return;
  }
  const isEdit = o.mode==="edit";
  p.innerHTML = `
    <div class="pop-head"><strong>${isEdit?"予約を変更する":"予約する"}</strong><button class="x" id="p_close" aria-label="閉じる">×</button></div>
    <div class="err" id="p_err" role="alert"></div>
    <div class="prow"><label for="p_room">会議室</label><select id="p_room"></select></div>
    <div class="prow"><label for="p_date">日付</label><input type="date" id="p_date"></div>
    <div class="prow"><label for="p_start">時間</label><div class="times"><select id="p_start"></select><span>〜</span><select id="p_end"></select></div></div>
    <div class="prow"><label for="p_purpose">用件</label><input type="text" id="p_purpose" maxlength="50" placeholder="任意（50 文字まで）"></div>
    <div class="pbtns"><button id="p_cancel">やめる</button><button class="primary" id="p_submit">${isEdit?"変更を保存":"予約する"}</button></div>`;
  $("p_room").innerHTML = rooms.map(r=>`<option value="${r.id}">${r.name}（${r.cap}名）</option>`).join("");
  $("p_room").value = o.roomId; $("p_date").value = o.date;
  slotOpts($("p_start"), OPEN, CLOSE-UNIT, o.start); fillEnd(o.end);
  $("p_purpose").value = o.purpose || "";
  sel = {roomId:o.roomId, date:o.date, start:o.start, end:o.end, draft:true};
  renderGrid();
  placePop(rect);
  $("p_start").onchange = () => { fillEnd(Number($("p_end").value)); syncDraft(); };
  $("p_end").onchange = $("p_room").onchange = $("p_date").onchange = syncDraft;
  $("p_close").onclick = $("p_cancel").onclick = closePop;
  $("p_submit").onclick = submitPop;
  $("p_purpose").onkeydown = e => { if (e.key==="Enter") submitPop(); };
  $("p_purpose").focus();
}

function validate() {
  const roomId=Number($("p_room").value), date=$("p_date").value, s=Number($("p_start").value), e=Number($("p_end").value);
  if (!date) return "日付を選んでください";
  if (!(e > s)) return "終了は開始より後にしてください";
  if (s < OPEN || e > CLOSE) return `予約できるのは ${hm(OPEN)}〜${hm(CLOSE)} の間です`;
  if (s < minStart(date)) return date===today ? `今日は ${hm(minStart(date))} 以降から予約できます` : "過去の日時は予約できません";
  if (date > addDays(today, 90)) return "予約できるのは今日から 90 日先までです";
  if (e - s > 4*60) return "1 件の予約は 4 時間までです";
  if (overlaps(roomId, date, s, e, pop.id)) return "その時間はすでに予約があります";
  return null;
}
function submitPop() {
  const msg = validate(); $("p_err").textContent = msg || "";
  if (msg) return;
  const v = { roomId:Number($("p_room").value), date:$("p_date").value, start:Number($("p_start").value), end:Number($("p_end").value), purpose:$("p_purpose").value.trim() };
  let id, text;
  if (pop.mode==="edit") { id=pop.id; Object.assign(find(id), v); text="予約を変更しました"; }
  else { id=nextId++; reservations.push({id, empId:who, ...v}); text="予約しました"; }
  viewDate = v.date; $("pop").style.display="none"; pop={mode:null,id:null}; sel=null;
  renderAll(); flash(id); toast(text);
}
function removeRes(id) {
  if (!confirm("この予約をキャンセルしますか？")) return;
  reservations = reservations.filter(r=>r.id!==id);
  $("pop").style.display="none"; pop={mode:null,id:null}; sel=null;
  renderAll(); toast("予約をキャンセルしました");
}

/* ---------- 表の操作（クリック・ドラッグ） ---------- */
$("grid").addEventListener("mousedown", e => {
  const td = e.target.closest("td.free"); if (!td) return;
  e.preventDefault();
  const room=Number(td.dataset.room), a=Number(td.dataset.m), b=a+Number(td.dataset.len);
  closePop();
  drag = {room, aStart:a, aEnd:b, lo:a, hi:b};
  sel = {roomId:room, date:viewDate, start:Math.max(a,minStart(viewDate)), end:b, draft:false}; paintSel();
});
$("grid").addEventListener("mouseover", e => {
  if (!drag) return;
  const td = e.target.closest("td.free");
  if (!td || Number(td.dataset.room)!==drag.room) return;
  const cm=Number(td.dataset.m), ce=cm+Number(td.dataset.len);
  const lo=Math.min(drag.aStart,cm), hi=Math.max(drag.aEnd,ce);
  if (overlaps(drag.room, viewDate, lo, hi)) return;
  drag.lo=lo; drag.hi=hi; sel = {roomId:drag.room, date:viewDate, start:Math.max(lo,minStart(viewDate)), end:hi, draft:false}; paintSel();
});
document.addEventListener("mouseup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  const click = d.lo===d.aStart && d.hi===d.aEnd;
  const start = Math.max(d.lo, minStart(viewDate));
  const end = click ? maxEnd(d.room, viewDate, start) : d.hi;
  if (end <= start) { sel=null; paintSel(); return; }
  sel = {roomId:d.room, date:viewDate, start, end, draft:true}; renderGrid();
  const cell = document.querySelector("td.draft");
  openPop({mode:"new", roomId:d.room, date:viewDate, start, end, purpose:""}, cell.getBoundingClientRect());
});
$("grid").addEventListener("click", e => {
  const td = e.target.closest("td.busy, td.mine"); if (!td) return;
  openPop({mode:"view", ...find(Number(td.dataset.id))}, td.getBoundingClientRect());
});
document.addEventListener("mousedown", e => {
  if ($("pop").style.display==="block" && !$("pop").contains(e.target) && !e.target.closest("td.free")) closePop();
});
document.addEventListener("keydown", e => { if (e.key==="Escape") closePop(); });

/* ---------- 下の欄・上のバー ---------- */
$("mine").onclick = e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) {
    const x = find(Number(ed)); closePop(); viewDate = x.date; renderAll();
    const c = document.querySelector(`td[data-id="${x.id}"]`); c.scrollIntoView({block:"nearest",inline:"center"});
    const rect = c.getBoundingClientRect();
    openPop({mode:"edit", ...x}, rect);
  }
  if (del) removeRes(Number(del));
  const card = e.target.closest(".rcard.jump");
  if (card && !e.target.closest("button")) {   // カードを押すと、その日付へジャンプ
    const x = find(Number(card.dataset.id));
    go(x.date); window.scrollTo({top:0, behavior:"smooth"}); flash(x.id);
  }
};
$("day").onclick = e => { const c = e.target.closest(".rcard"); if (c) flash(Number(c.dataset.id)); };
$("who").onchange = () => { who = Number($("who").value); closePop(); renderAll(); };
const go = d => { closePop(); viewDate = d; renderAll(); };
$("prev").onclick = () => go(addDays(viewDate,-1));
$("next").onclick = () => go(addDays(viewDate,1));
$("today").onclick = () => go(today);
$("datePick").onchange = () => { if ($("datePick").value) go($("datePick").value); };
window.addEventListener("resize", placeNow);
setInterval(() => { if (!drag) renderAll(); }, 30000);
document.addEventListener("mouseover", e => { const c = e.target.closest(".rcard[data-id]"); hl(c ? c.dataset.id : null); });

// 初期表示
$("who").innerHTML = employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join("");
tickClock(); renderAll();
</script>
</body>
</html>
